[cockpit]
name = "extended"
siblings_root = "."

[[sibling]]
slug = "api"
dir = "api"
mount = "always"
acquire = "none"
var = "API_DIR"
purpose = "Synthetic API"

[ports.bases]
API_HOST_PORT = 4400

[environment.machine]
runtime_memory_mb = 512
runtime_cpus = 1
free_disk_mb = 1024
cold_start_seconds = 60

[environment]
compose_files = ["compose.yml"]
# Reached on leased localhost ports, with no sign-in; preflight refuses until this is declared.
addressing = "port"
authentication = "none"
posture_requirements = [{ requirement = "leased-localhost-ports", addressing = "port" }]

[[guards.allow]]
argv = ["make", "verify"]
reason = "The repository-owned verification target is non-destructive."
cwd = "."

[[guards.deny]]
contains = ["--environment", "shared"]
reason = "Shared environments require an operator."
fix = "Use the local environment."

[[surfaces.overlays]]
name = "verify-workflow"
feature = "skills"
source = "cockpit.toml"
sources = [
  { path = "skills/verify-workflow/SKILL.md", bytes = "---\nname: verify-workflow\ndescription: Use when validating this repository's build-beside workflow.\ntargets: [\"*\"]\ncockpit:\n  tools: [shell]\n  tool-equivalences:\n    claudecode: [Bash]\n    codexcli: [shell]\n    opencode: [bash]\n  commands: [check]\n  changes: [nothing]\n  non-goals: [release, deployment]\n  procedure: procedures/verify.md\n  review: { mechanical: make-verify, judgment: pending }\n  entry-point-lines: 6\nclaudecode:\n  allowed-tools: [Bash]\ncodexcli:\n  dependencies:\n    tools: [{ type: executable, value: cockpit, description: Runs accepted cockpit CLI primitives. }]\nopencode:\n  allowed-tools: [bash]\n---\n\n# Verify workflow\n\nUse `Bash` in Claude Code, `shell` in Codex CLI, or `bash` in OpenCode.\nRun `make verify`, then use `cockpit check`; do not release or deploy.\n" },
  { path = "skills/verify-workflow/procedures/verify.md", bytes = "---\nloading: pull\nbudget: uncapped\n---\n\n# Verify the build-beside workflow\n\nRun `make verify` from the cockpit root, then run `cockpit check --config cockpit.toml`.\nReport each result and stop on a failure. This procedure does not authorize release or deployment.\n" },
]

[[surfaces.overlays]]
name = "verify-before-write"
feature = "hooks"
source = "cockpit.toml"
sources = [{ path = "hooks.jsonc", bytes = "{\"hooks\":{\"preToolUse\":[{\"type\":\"command\",\"command\":\"make verify\",\"matcher\":\"Write\"}]}}\n" }]
