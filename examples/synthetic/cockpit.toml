[cockpit]
name = "synthetic-example"
siblings_root = "repositories"

[guards]
vendor_endpoint_hosts = [ "api.vendor.example.test" ]

[[sibling]]
slug = "app"
dir = "app"
mount = "always"
acquire = "none"
var = "APP_DIR"
toolchain = "node"
purpose = "Synthetic application"

[[sibling.environment_files]]
template = ".env.example"
instance = ".env"

[[sibling]]
slug = "web"
dir = "web"
mount = "none"
# A local repository has no hosted remote whose identity preflight could compare, so it is
# declared as an existing checkout rather than with a local-path remote.
acquire = "none"
var = "WEB_DIR"
purpose = "Synthetic web repository"

[ports.bases]
APP_HOST_PORT = 4100

[[environment.install_policies]]
toolchain = "node"
volume = "dependencies"
lockfile = "package-lock.json"
install = [ "npm", "ci" ]
load_probe = [ "node", "probe.mjs", "load" ]
build = [ "npm", "run", "build" ]
test = [ "npm", "test", "--", "unit.test.ts" ]

[environment.generated]
compose_file = "compose.generated.yml"

[[environment.generated.services]]
id = "app"
sibling = "app"
role = "service"
profiles = [ "application" ]
command = [ "node", "server.mjs" ]
dependencies = []

[environment.generated.services.image]
reference = "node@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5"
reason = "Pinned synthetic runtime"
architectures = [ "amd64", "arm64" ]

