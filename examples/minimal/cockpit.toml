[cockpit]
name = "tinya"
siblings_root = "."

[[sibling]]
slug = "api"
dir = "api"
mount = "always"
acquire = "none"
var = "API_DIR"
purpose = "Tiny api"

[ports.bases]
API_HOST_PORT = 4100

[environment]
compose_files = ["compose.yml"]
# Reached on leased localhost ports, with no sign-in; preflight refuses until this is declared.
addressing = "port"
authentication = "none"
posture_requirements = [{ requirement = "leased-localhost-ports", addressing = "port" }]

[environment.machine]
runtime_memory_mb = 512
runtime_cpus = 1
free_disk_mb = 1024
cold_start_seconds = 60
