# The synthetic cockpit the sync and check tests publish: one sibling with an environment file
# and an install policy, and no runtime, so publication runs without a container runtime.
[cockpit]
name = "generated-environment"

[guards]
vendor_endpoint_hosts = [ "api.vendor.example.test" ]

[[sibling]]
slug = "app"
dir = "app"
mount = "always"
acquire = "none"
var = "APP_DIR"
toolchain = "node"
purpose = "Synthetic application"

[[sibling.environment_files]]
template = ".env.example"
instance = ".env"

[ports.bases]
APP_HOST_PORT = 4100

[[environment.install_policies]]
toolchain = "node"
lockfile = "package-lock.json"
build = [ "npm", "run", "build" ]
test = [ "npm", "test", "--", "unit.test.ts" ]
