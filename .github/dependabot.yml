version: 2

# Weekly and grouped so one review covers a week of updates. The cooldown keeps a freshly
# published release out of the lockfile until a hijacked or malicious publish has usually been
# found and pulled. npm waits by semver level: a major changes the most and is the rarest update,
# so it waits a month; a patch is usually a fix, so it waits three days, which still keeps out
# the first days after a publish, when a hijacked release is most often caught. GitHub Actions
# has no semver-level cooldown, so its entry keeps the single seven-day default.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      # These versions are pinned by a check, so their update cannot pass CI as Dependabot opens
      # it: rulesync and esbuild produce the committed libexec/rulesync-generator.cjs bundle, the
      # others carry a binary or are runtime dependencies that scripts/supply-chain-check.mjs
      # pins. They arrive together in one pull request that auto-merge skips; a maintainer
      # finishes it with "Updating pinned dependencies" in docs/contributing/releasing.md.
      # A dependency joins the first group it matches, so this group must stay first.
      pinned-by-hand:
        patterns:
          - rulesync
          - esbuild
          - '@changesets/*'
          - typescript
          - '@typescript/*'
          - tsx
          - vitest
          - smol-toml
          - yaml
          - zod
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
