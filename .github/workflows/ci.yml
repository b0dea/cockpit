name: CI

# Keep anonymisation mechanical. A written publication rule without this job would depend on
# whether a human remembered to run the scanner before pushing.
#
# `ci-ok` is the one required status check. Every other job may be skipped by the change filter,
# so none of them can be required individually without leaving docs-only pull requests pending.
on:
  pull_request:
    # The changeset check reads labels, so a label change has to re-run it.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # The supported Node range's upper edge also gets its full suite once a week, so a Node-version
  # regression surfaces even when no release is being prepared.
  schedule:
    - cron: '17 4 * * 1'

# Nothing here publishes, comments, or writes back to the repository. The default grants
# nothing; each job that checks out code asks for contents: read and no more.
permissions: {}

# The event name keeps the weekly run out of the push queue, where a newer pending run would
# replace an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # A newer push supersedes the run in progress: its commit contains everything the older one
  # tested, and queued pushes to main otherwise wait for every earlier full run in turn.
  cancel-in-progress: true

jobs:
  # Decides which heavy jobs a change needs, inside the workflow. A workflow-level paths-ignore
  # would leave required checks pending forever on docs-only pull requests.
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      lockfile: ${{ steps.classify.outputs.lockfile }}
      release: ${{ steps.classify.outputs.release }}
      changeset: ${{ steps.classify.outputs.changeset }}
      platforms: ${{ steps.classify.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and both parents: enough to diff the pull request against its base.
          fetch-depth: 2
          persist-credentials: false
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          MACOS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'test-macos') }}
        run: |
          set -euo pipefail
          # A push to main cannot stop a publish: the release workflow runs beside this one, and
          # the pull request already tested this tree. The suite that guards a release runs on the
          # Version Packages pull request, whose required ci-ok a merge has to pass.
          if [[ "$EVENT_NAME" == push ]]; then
            printf '%s\n' code=false lockfile=false release=false changeset=false platforms=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" != pull_request ]]; then
            printf '%s\n' code=true lockfile=true release=false changeset=false platforms=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"
          added_changesets="$(git diff --name-only --no-renames --diff-filter=A HEAD^1 HEAD -- '.changeset/*.md' | grep -v '^\.changeset/README\.md$' || true)"
          printf 'changed files:\n%s\n' "$changed"
          # Documentation-only: the files that no build, test or package inventory reads. Package
          # READMEs and anything under packages/ are code, because the tarball ships them.
          docs_only='^(docs/.*|[^/]+\.md|\.changeset/.*\.md|\.github/ISSUE_TEMPLATE/.*|\.github/PULL_REQUEST_TEMPLATE\.md)$'
          code=false
          # `>/dev/null`, never `grep -q`: under pipefail, a reader that stops at its first match kills
          # the writer on a long list, and the failed pipeline read as "no code changed" and skipped the tests.
          if printf '%s\n' "$changed" | grep -Ev "$docs_only" >/dev/null; then code=true; fi
          lockfile=false
          if printf '%s\n' "$changed" | grep -E '^(package\.json|package-lock\.json|packages/[^/]+/package\.json)$' >/dev/null; then lockfile=true; fi
          # A user-visible change is shipped source or surfaces. Tests and test support are not.
          release=false
          if printf '%s\n' "$changed" | grep -E '^packages/cockpit/(src|surfaces)/' | grep -Ev '\.test\.ts$|/test-support/' >/dev/null; then release=true; fi
          changeset=false
          if [[ -n "$added_changesets" ]]; then changeset=true; fi
          # The release workflow publishes any package version that is not on npm yet, whichever
          # commit is at the head of main. So every platform runs on the Version Packages pull
          # request, on anything else that moves the version, and on anything merging while the
          # current version is unpublished, as it is after a failed publish. A registry error reads
          # as unpublished. The label asks for the same cells on a change likely to behave
          # differently on macOS.
          version_at() { git show "$1:packages/cockpit/package.json" | node -p 'JSON.parse(require("node:fs").readFileSync(0)).version'; }
          base_version="$(version_at HEAD^1)"
          head_version="$(version_at HEAD)"
          published="$(npm view "@b00dea/cockpit@$base_version" version 2>/dev/null || true)"
          platforms=false
          if [[ "$HEAD_REF" == changeset-release/main || "$MACOS_LABEL" == true \
            || "$head_version" != "$base_version" || "$published" != "$base_version" ]]; then
            platforms=true
            code=true
          fi
          printf '%s\n' "code=$code" "lockfile=$lockfile" "release=$release" "changeset=$changeset" "platforms=$platforms" >> "$GITHUB_OUTPUT"

  # Its own job rather than a step inside the matrix, so a red build names which rule broke.
  # "tests failed" and "the tree leaked" are different emergencies and must not look alike in
  # the checks list. It also carries the documentation checks, so a docs-only change still
  # meets every rule that reads documentation without paying for the matrix.
  #
  # What this job can and cannot enforce, because a green tick here is read as more than it is:
  # the scan has two classes, and a CI checkout holds only the material for one. Credential
  # shapes and private absolute paths are universal and are enforced here on every push. The
  # site-specific names live in an ignored file that exists only in the maintainer's checkout,
  # so THIS JOB CANNOT CATCH A SITE-NAME LEAK. That class is enforced where commits originate,
  # by the commit hook, and the scan prints which classes it covered.
  hygiene:
    name: anonymisation scan and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Actions are pinned to a full-length commit SHA, never a tag: a tag is mutable and
      # resolves to wherever its owner last moved it, so a tag reference is a dependency that
      # updates itself without review. The trailing comment says which release the SHA is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks below scans every commit, not only the tip.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      # Aikido safe-chain checks every package the install below resolves against a malware feed
      # and stops the install on a hit, so a pull request cannot slip a known-malicious version
      # into the lockfile. It needs no account. The installer is pinned by its release digest and
      # verifies the binary it downloads; the next step fails if npm is not routed through it.
      - name: route package installs through the malware check
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.27/install-safe-chain.sh -o "$RUNNER_TEMP/install-safe-chain.sh"
          echo "600ebddcb3aaf1fd53653a8d7985df44528722c0f5ee7eb9fff86f26a1a4e5a8  $RUNNER_TEMP/install-safe-chain.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/install-safe-chain.sh" --ci
      - name: install dependencies through the malware check
        run: |
          case "$(command -v npm)" in
            "$HOME/.safe-chain/"*) ;;
            *) echo "::error::npm resolves to $(command -v npm), not the safe-chain shim"; exit 1 ;;
          esac
          npm ci --ignore-scripts
      - name: nothing consumer-identifying reaches the tracked tree
        # Fails closed. vitest exits non-zero when a path matches no test file, so a scan
        # that has been renamed or deleted turns this job red rather than passing over
        # nothing. The scan itself reports what it covered; read that line before trusting a
        # green run from a clone that carries no site-specific list.
        run: npm test -- packages/cockpit/src/tree-hygiene.test.ts
      # gitleaks scans every commit with its maintained ruleset, beside the credential shapes the
      # scan above knows. The binary is pinned by its release digest; .gitleaksignore lists reviewed
      # false positives by fingerprint, so any new finding fails the job.
      - name: no credential anywhere in the history
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
      - run: npm run lint:docs
      - run: npm run lint:markdown
      # Tracked pages only: a glob would also walk node_modules, which lychee does not skip.
      - run: git ls-files '*.md' > "$RUNNER_TEMP/markdown-files"
      - name: internal links and fragments resolve
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --include-fragments --no-progress --files-from ${{ runner.temp }}/markdown-files
          jobSummary: false
      # The generated pages are rendered from the source in this checkout; a page that differs
      # from what the script writes was not regenerated with the change that moved it.
      - name: generated references match their sources
        run: |
          npm run references
          git diff --exit-code
      # The documentation tests read docs/ directly. On a code change the full matrix runs
      # them again; this keeps them on the docs-only path the matrix is skipped for.
      - name: documentation contracts
        run: npm test -- packages/cockpit/src/docs-ownership.test.ts packages/cockpit/src/docs-decisions.test.ts packages/cockpit/src/docs-lint.test.ts packages/cockpit/src/references.test.ts

  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }}, ${{ matrix.gate }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      # One platform's failure must not hide the other's: a macOS-only path bug is exactly
      # what this matrix exists to find.
      fail-fast: false
      matrix:
        # Three lists, because a macOS minute costs ten times a Linux minute in a private repository
        # and the full suite is long: about 15 minutes at four workers on a developer machine,
        # longer on a hosted runner with fewer cores. The step timeouts below leave room for that.
        # - pull request: the full suite on Linux at the supported floor. The Linux suite is split
        #   into four shards: on one runner it took about 32 minutes, and the shards together take
        #   about 20. One shard holds the platform-independent extras.
        # - every platform, before a release: the same Linux shards, the full suite on macOS at the
        #   floor, and the launcher-level compatibility subset on the other supported Node lines.
        #   The classify job selects it for the Version Packages pull request, so a platform or
        #   Node regression stops the release it would have shipped in.
        # - weekly: the full suite at the upper edge of the supported Node range.
        # macOS does not run a test subset on ordinary pull requests: selecting the tests that
        # import a change chose 150 to 163 of 164 files in every recorded run, so it cost the same
        # as the full suite.
        include: ${{ fromJSON(needs.changes.outputs.platforms == 'true' && '[{"os":"ubuntu-latest","node":"22.22.0","gate":"full","shard":"1/4","extras":true},{"os":"ubuntu-latest","node":"22.22.0","gate":"full","shard":"2/4"},{"os":"ubuntu-latest","node":"22.22.0","gate":"full","shard":"3/4"},{"os":"ubuntu-latest","node":"22.22.0","gate":"full","shard":"4/4"},{"os":"macos-latest","node":"22.22.0","gate":"full"},{"os":"ubuntu-latest","node":"24","gate":"compatibility"},{"os":"ubuntu-latest","node":"26","gate":"compatibility"}]' || github.event_name == 'schedule' && '[{"os":"ubuntu-latest","node":"26","gate":"full"}]' || '[{"os":"ubuntu-latest","node":"22.22.0","gate":"full","shard":"1/4","extras":true},{"os":"ubuntu-latest","node":"22.22.0","gate":"full","shard":"2/4"},{"os":"ubuntu-latest","node":"22.22.0","gate":"full","shard":"3/4"},{"os":"ubuntu-latest","node":"22.22.0","gate":"full","shard":"4/4"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # `ci`, not `install`: the lockfile decides, and a lockfile that no longer satisfies
      # package.json fails here instead of being quietly rewritten.
      - run: npm ci --ignore-scripts
      # The rendered shell is sourced in both bash and zsh, because a resolved registry that
      # only parses under one of them is a bug this suite exists to catch. zsh ships on the
      # macOS image and not the Ubuntu one, so without this the Linux half of that pair
      # measures the runner image rather than the rendered bytes.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends zsh
      - run: npm run build
      - if: matrix.gate == 'full'
        timeout-minutes: 65
        env:
          SHARD: ${{ matrix.shard }}
        run: npm test -- ${SHARD:+--shard=$SHARD}
      - if: matrix.gate == 'compatibility'
        timeout-minutes: 15
        run: npm test -- packages/cockpit/src/launcher.test.ts packages/cockpit/src/package-metadata.test.ts packages/cockpit/src/environment/runtime-probe.slow.test.ts
      - name: tests leave the committed schema unchanged
        run: git diff --exit-code -- packages/cockpit/cockpit.schema.json
      # Platform-independent checks run once, on the cell that already holds an install and a
      # build. The full suite on that cell also covers the synthetic example and the package
      # inventory tests, so they need no separate job.
      - if: matrix.extras
        run: npm run typecheck
      - if: matrix.extras
        run: npm run lint:supply-chain
      - if: matrix.extras
        run: node scripts/supply-chain-check.ts --sbom "$RUNNER_TEMP/cockpit-sbom.cdx.json"
      # Registry signatures and provenance attestations of every installed package: catches a
      # tampered or unsigned tarball that the lockfile integrity hash alone would accept.
      - if: matrix.extras
        run: npm audit signatures

  test-protection:
    name: test protection
    # The weekly run has no change to compare.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The guard that judges a change must not come from the change: a pull request could
          # loosen it and weaken tests in the same diff. Fail closed when the base has no copy
          # (first commit, new branch, or a base that is no longer fetched).
          # The script imports the shared detector, so both come from the base. A base from before
          # that split holds a self-contained script, which is then the whole guard.
          mkdir -p "$RUNNER_TEMP/guard"
          if ! git archive "$BASE_SHA" scripts/check-test-protection.mjs packages/cockpit/src/testing/test-protection.ts 2>/dev/null | tar -x -C "$RUNNER_TEMP/guard" \
            && ! git archive "$BASE_SHA" scripts/check-test-protection.mjs | tar -x -C "$RUNNER_TEMP/guard"; then
            echo "::error::Cannot read scripts/check-test-protection.mjs at the base revision $BASE_SHA, so this change cannot be checked against a trusted guard. Refusing to run the copy from the change itself."
            exit 1
          fi
          node "$RUNNER_TEMP/guard/scripts/check-test-protection.mjs" "$BASE_SHA" "$HEAD_SHA" merge-base
      - if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Same as the pull request step: the base's guard, and fail closed without one.
          # The script imports the shared detector, so both come from the base. A base from before
          # that split holds a self-contained script, which is then the whole guard.
          mkdir -p "$RUNNER_TEMP/guard"
          if ! git archive "$BEFORE_SHA" scripts/check-test-protection.mjs packages/cockpit/src/testing/test-protection.ts 2>/dev/null | tar -x -C "$RUNNER_TEMP/guard" \
            && ! git archive "$BEFORE_SHA" scripts/check-test-protection.mjs | tar -x -C "$RUNNER_TEMP/guard"; then
            echo "::error::Cannot read scripts/check-test-protection.mjs at the base revision $BEFORE_SHA, so this change cannot be checked against a trusted guard. Refusing to run the copy from the change itself."
            exit 1
          fi
          node "$RUNNER_TEMP/guard/scripts/check-test-protection.mjs" "$BEFORE_SHA" "$AFTER_SHA" exact

  runtime-floor-negative:
    name: runtime floor negative control (node 20)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: launcher refuses before importing compiled code
        shell: bash
        run: |
          set +e
          NODE_DEBUG=esm node packages/cockpit/bin/cockpit.mjs --help \
            >"$RUNNER_TEMP/cockpit-node20.stdout" \
            2>"$RUNNER_TEMP/cockpit-node20.stderr"
          node20_status=$?
          set -e
          test "$node20_status" -ne 0
          grep -Eq 'COCKPIT_NODE_VERSION_UNSUPPORTED.*22' "$RUNNER_TEMP/cockpit-node20.stderr"
          ! grep -q 'packages/cockpit/dist/' "$RUNNER_TEMP/cockpit-node20.stderr"

  # A change to shipped source or surfaces is a release note someone has to write. The label is
  # the deliberate escape hatch for changes that alter nothing a consumer can observe.
  changeset:
    name: changeset present
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          CHANGESET_ADDED: ${{ needs.changes.outputs.changeset }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if [[ "$CHANGESET_ADDED" == true ]]; then
            echo 'changeset found'
          elif printf '%s' "$LABELS" | grep -F '"no-changeset"' >/dev/null; then
            echo 'no-changeset label present: skipping the changeset requirement'
          else
            echo "::error::This pull request changes packages/cockpit/src or packages/cockpit/surfaces without a changeset. Run 'npx changeset' and commit the new .changeset/*.md file, or ask a maintainer to add the 'no-changeset' label if no consumer-visible behavior changed."
            exit 1
          fi

  # The release workflow opens the Version Packages pull request from this branch, and a reviewer
  # reads it as a version bump. The guard holds it to that, so a commit pushed onto the branch
  # cannot ride along with the bump. See .github/scripts/check-version-pr-scope.sh.
  version-pr-scope:
    name: version pull request scope
    if: github.event_name == 'pull_request' && github.head_ref == 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its base parent: the pull request's change against main.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Like the test-protection job, the guard comes from the base parent, not from the change it judges.
      - run: |
          set -euo pipefail
          if ! git show HEAD^1:.github/scripts/check-version-pr-scope.sh > "$RUNNER_TEMP/check-version-pr-scope.sh"; then
            echo "::error::Cannot read .github/scripts/check-version-pr-scope.sh at the base parent commit, so this change cannot be checked against a trusted guard. Refusing to run the copy from the change itself."
            exit 1
          fi
          bash "$RUNNER_TEMP/check-version-pr-scope.sh" HEAD^1 HEAD

  # Needs a public repository (or GitHub Advanced Security), so it skips itself in a private
  # repository instead of failing every dependency change there.
  dependency-review:
    name: dependency review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.lockfile == 'true' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # The single required status check. `always()` keeps it running when a need failed, and a
  # skipped need counts as passed: the change filter skips jobs on purpose, but a failed or
  # cancelled one must never read as green.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, hygiene, test, test-protection, runtime-floor-negative, changeset, version-pr-scope, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$NEEDS" | node -e '
            const needs = JSON.parse(require("node:fs").readFileSync(0, "utf8"))
            const bad = Object.entries(needs).filter(([, need]) => need.result === "failure" || need.result === "cancelled")
            for (const [name, need] of Object.entries(needs)) console.log(name + ": " + need.result)
            if (bad.length) { console.error("::error::failed or cancelled: " + bad.map(([name]) => name).join(", ")); process.exit(1) }
          '
