name: External link report

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: report external links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: check external links without gating changes
        run: node scripts/docs-lint.mjs --external-report "$RUNNER_TEMP/external-links.json"
      - name: upload actionable report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: external-links
          path: ${{ runner.temp }}/external-links.json
          if-no-files-found: error
