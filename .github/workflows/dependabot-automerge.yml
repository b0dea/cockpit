name: Dependabot auto-merge

# Patch and minor updates merge themselves once the required `ci-ok` check passes. Major
# updates and the `pinned-by-hand` group (see .github/dependabot.yml) are left for a person.
# Auto-merge only queues the merge: branch protection still gates it, so this workflow cannot
# merge a pull request that fails CI.
on:
  pull_request:

permissions:
  contents: read

jobs:
  automerge:
    name: enable auto-merge
    # The pull request author, not the triggering actor: the actor changes when a person
    # re-runs the workflow, the author does not.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major' && steps.metadata.outputs.dependency-group != 'pinned-by-hand'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
