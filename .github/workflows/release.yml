name: Release

# Changesets keeps a "Version Packages" pull request open on main. Merging it publishes with npm
# trusted publishing (OIDC, no stored token) and attaches provenance. While packages/cockpit is
# `private: true` there is nothing to publish, so this pipeline can sit ready until the package is
# made public.
#
# The work is split into jobs so the OIDC token exists only where it is spent. `select-mode`
# decides, holding no write scope; `version` maintains the pull request and never holds id-token;
# `publish` alone holds id-token, and only under the `npm` deployment environment, which the npm
# trusted publisher names, so a token minted by any other job is refused by the registry.
#
# Two limits of the token these jobs hold, both handled by hand and described in
# docs/contributing/releasing.md: trusted publishing cannot create a package, so the first
# publication is a manual bootstrap; and a pull request opened with GITHUB_TOKEN starts no
# workflows, so CI (and the required ci-ok check) runs on the Version Packages pull request only
# after a maintainer closes and reopens it.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel a release half way: a cancelled publish can leave a version on the registry
# with no tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# No job restores a dependency cache: a release job must not restore state a pull request could
# have written. Node 24 ships the npm that trusted publishing needs; the publish script verifies
# the version rather than assuming it.
jobs:
  # `version` while changesets are pending, `publish` once the Version Packages pull request has
  # merged and its version is not on npm yet, `none` otherwise. A private package is never in the
  # publish plan, so it reads `none`; changesets still reads `version` for it but versions nothing,
  # which opened an empty Version Packages pull request on every push. `private` gates that job.
  select-mode:
    name: select release mode
    if: github.repository == 'b0dea/cockpit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      private: ${{ steps.package.outputs.private }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      - id: package
        run: echo "private=$(node -p "require('./packages/cockpit/package.json').private === true")" >> "$GITHUB_OUTPUT"
      - name: say why a private package is neither versioned nor published
        if: steps.package.outputs.private == 'true'
        run: |
          echo "::notice::packages/cockpit/package.json is private: true, so nothing was versioned or published. Set private to false and follow 'First publication' in docs/contributing/releasing.md to enable releases."

  version:
    name: version pull request
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version' && needs.select-mode.outputs.private == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # the version branch
      pull-requests: write  # open and update the Version Packages pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changelog step looks up the commit that added each changeset. From a shallow clone it
          # runs git fetch --deepen, which has no credentials here and failed on the private repository.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: bash .github/scripts/release-version.sh
          pr-title: Version Packages
          commit-message: Version Packages

  # The package is built here, under the OIDC token, by its prepack script. A separate pack job
  # without the token would not contain a compromised build: the tarball it produced is what this
  # job publishes. So the build stays where the stamp and the publish are, in one checkout.
  publish:
    name: publish to npm
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: write  # tags and the GitHub release
      id-token: write  # npm trusted publishing and provenance (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - id: changesets
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: bash .github/scripts/release-publish.sh
        env:
          NPM_CONFIG_PROVENANCE: 'true'
      # The record names the exact published version and its registry integrity, so `cockpit
      # upgrade` can compare two releases offline. See docs/release-policy.md.
      - name: upload the release record to the GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          # shellcheck disable=SC2016 # the single quotes hold a JavaScript template literal for node, not shell
          IFS=$'\t' read -r package_name version < <(node -e '
            const published = JSON.parse(process.env.PUBLISHED_PACKAGES)
            if (!Array.isArray(published) || published.length !== 1
                || published[0]?.name !== "@b0dea/cockpit"
                || typeof published[0]?.version !== "string") process.exit(2)
            process.stdout.write(`${published[0].name}\t${published[0].version}\n`)
          ')
          integrity="$(npm view "${package_name}@${version}" dist.integrity --json | node -e '
            let bytes = ""
            process.stdin.setEncoding("utf8")
            process.stdin.on("data", chunk => { bytes += chunk })
            process.stdin.on("end", () => {
              const value = JSON.parse(bytes)
              if (typeof value !== "string") process.exit(2)
              process.stdout.write(value)
            })
          ')"
          node packages/cockpit/libexec/release-evidence.mjs record \
            --package "$package_name" --version "$version" --integrity "$integrity" \
            --output release-evidence.json
          tag="${package_name}@${version}"
          observed_tag="$(gh release view "$tag" --json tagName --jq .tagName)"
          if [[ "$observed_tag" != "$tag" ]]; then
            echo "::error::expected release tag '$tag', observed '$observed_tag'" >&2
            exit 1
          fi
          gh release upload "$tag" release-evidence.json release-evidence.json.sha256
