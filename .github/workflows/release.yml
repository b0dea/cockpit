name: Release

# Changesets keeps a "Version Packages" pull request open on main. Merging it runs the publish
# script below, which publishes with npm trusted publishing (OIDC, no stored token) and
# attaches provenance. While packages/cockpit is `private: true` the script logs that and
# publishes nothing, so this pipeline can sit ready until the package is made public.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Never cancel a release half way: a cancelled publish can leave a version on the registry
# with no tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: version pull request or publish
    if: github.repository == 'b0dea/cockpit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # tags, GitHub releases and the version branch
      pull-requests: write  # open and update the Version Packages pull request
      id-token: write       # npm trusted publishing and provenance (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache: a release job must not restore state a pull request could have
      # written. Node 24 ships the npm that trusted publishing needs; the publish script
      # verifies the version rather than assuming it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish: bash .github/scripts/release-publish.sh
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
