name: Bug report
description: cockpit does something it should not, or fails to do something it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not go here; see [SECURITY.md](https://github.com/b0dea/cockpit/blob/main/SECURITY.md).
        One defect per issue. Use invented names: nothing that identifies a private deployment.
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output
      description: Pasted, not summarised.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        cockpit (npx --no cockpit --version):
        node -v:
        OS:
        agent tool (if involved):
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Minimal cockpit.toml excerpt
      description: Only the relevant part, with secrets and private names removed.
      render: toml
