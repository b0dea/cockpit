name: Question
description: How something works, or whether cockpit fits what you are doing.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Use invented names: nothing that identifies a private deployment. For vulnerabilities see
        [SECURITY.md](https://github.com/b0dea/cockpit/blob/main/SECURITY.md).
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you read or tried
      description: Which page you read and what you expected it to say.
    validations:
      required: true
