name: Feature request
description: Something cockpit should do and cannot.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the failure, not only the feature. Use invented names: nothing that identifies a
        private deployment.
  - type: textarea
    id: problem
    attributes:
      label: What goes wrong today
      description: Concretely, and what you do instead.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. The command, configuration key or generated file you would expect.
  - type: textarea
    id: check
    attributes:
      label: How we would know it works
      description: A check that can go red, if there is one.
    validations:
      required: true
